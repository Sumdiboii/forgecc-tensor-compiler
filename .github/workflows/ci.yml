name: CI
run-name: CI ${{ inputs.ref || github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch/tag to test
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          if [ -f CMakeLists.txt ]; then
            if [ -f CMakePresets.json ]; then
              cmake --preset default -DFORGECC_BUILD_TESTS=ON -DFORGECC_BUILD_BENCHMARKS=ON
            else
              cmake -S . -B build -G Ninja -DFORGECC_BUILD_TESTS=ON -DFORGECC_BUILD_BENCHMARKS=ON
            fi
          else
            echo "No CMake project at this commit; treating as documentation-only."
          fi

      - name: Build
        run: |
          if [ -f CMakeLists.txt ]; then
            cmake --build build --parallel 2
          fi

      - name: Test
        run: |
          if [ -f CMakeLists.txt ]; then
            ctest --test-dir build --output-on-failure
          fi